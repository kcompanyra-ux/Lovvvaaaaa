<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        .hero { background: #f4f4f4; padding: 40px; text-align: center; border-radius: 8px; }
        .btn { display: inline-block; background: #007bff; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; }
        nav { margin-bottom: 20px; border-bottom: 1px solid #ccc; padding-bottom: 10px; }
    </style>
</head>
<body>
    <nav>
        <strong>{{ site.title }}</strong>
    </nav>
    {{ content }}
    <footer>
        <p>&copy; 2024 My Website. Edited with CloudCannon.</p>
    </footer>
</body>
</html>
