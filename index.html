<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>50 Ticket Event</title>
    <!-- jsPDF for generating the ticket PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #f4f4f9; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 15px; max-width: 800px; margin: 20px auto; }
        .ticket-btn { padding: 20px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .ticket-btn:hover { background: #0056b3; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 10px; width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        .submit-btn { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .cancel-btn { width: 100%; padding: 10px; background: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>🎟️ Grab Your Ticket!</h1>
    <p id="status">Loading tickets...</p>
    <div class="grid" id="ticketGrid"></div>

    <!-- Modal for User Input -->
    <div class="modal" id="claimModal">
        <div class="modal-content">
            <h2>Claim Ticket #<span id="modalTicketId"></span></h2>
            <form id="claimForm">
                <input type="text" id="userName" placeholder="Your Full Name" required>
                <input type="email" id="userEmail" placeholder="Your Email" required>
                <button type="submit" class="submit-btn">Confirm & Download PDF</button>
                <button type="button" class="cancel-btn" onclick="closeModal()">Cancel</button>
            </form>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        // REPLACE THIS WITH YOUR PIPEDREAM HTTP WEBHOOK URL
        const PIPEDREAM_URL = "https://eozze70y7c24v40.m.pipedream.net"; 

        let selectedTicketId = null;

        // ==========================================
        // APP LOGIC
        // ==========================================
        
        // Fetch available tickets from Pipedream Database
        async function loadTickets() {
            try {
                const response = await fetch(PIPEDREAM_URL);
                const tickets = await response.json();
                renderTickets(tickets);
            } catch (error) {
                document.getElementById('status').innerText = "Error loading tickets.";
                console.error(error);
            }
        }

        // Render tickets on the screen
        function renderTickets(tickets) {
            const grid = document.getElementById('ticketGrid');
            const status = document.getElementById('status');
            
            grid.innerHTML = '';
            status.innerText = `${tickets.length} Tickets Remaining`;

            if (tickets.length === 0) {
                status.innerText = 'SOLD OUT! All 50 tickets have been claimed.';
                return;
            }

            tickets.forEach(ticket => {
                const btn = document.createElement('button');
                btn.className = 'ticket-btn';
                btn.innerText = `#${ticket.id}`;
                btn.onclick = () => openModal(ticket.id);
                grid.appendChild(btn);
            });
        }

        function openModal(ticketId) {
            selectedTicketId = ticketId;
            document.getElementById('modalTicketId').innerText = ticketId;
            document.getElementById('claimModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('claimModal').style.display = 'none';
            document.getElementById('claimForm').reset();
        }

        // Handle Form Submission
        document.getElementById('claimForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('userName').value;
            const email = document.getElementById('userEmail').value;

            // 1. Send claim request to Pipedream
            const response = await fetch(PIPEDREAM_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ticketId: selectedTicketId, customerName: name, customerEmail: email })
            });

            const data = await response.json();

            if (data.success) {
                // 2. Auto-Download PDF for the customer
                generatePDF(name, selectedTicketId);

                // 3. Refresh the grid (Ticket will disappear because Pipedream marked it as taken)
                closeModal();
                loadTickets(); 
                
                alert(`Success! Ticket #${selectedTicketId} is yours. Check your downloads.`);
            } else {
                alert(data.error || "Failed to claim ticket.");
            }
        });

        // ==========================================
        // PDF GENERATION
        // ==========================================
        function generatePDF(name, ticketId) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFontSize(24);
            doc.text("EVENT TICKET", 105, 30, { align: 'center' });
            
            doc.setFontSize(16);
            doc.text(`Ticket Number: #${ticketId}`, 105, 60, { align: 'center' });
            
            doc.setFontSize(14);
            doc.text(`Issued To: ${name}`, 105, 80, { align: 'center' });
            doc.text(`Date: ${new Date().toLocaleDateString()}`, 105, 100, { align: 'center' });
            
            doc.setFontSize(12);
            doc.text("Please present this PDF at the entrance.", 105, 150, { align: 'center' });

            // Auto-download
            doc.save(`Ticket-${ticketId}-${name.replace(/\s+/g, '-')}.pdf`);
        }

        // Start the app
        loadTickets();
    </script>
</body>
</html>
