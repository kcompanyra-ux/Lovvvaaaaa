<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Tickets</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: #151b2b;
            --accent-cyan: #00f2fe;
            --accent-pink: #fe0979;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            /* Subtle glowing background orbs */
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(0, 242, 254, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(254, 9, 121, 0.08) 0%, transparent 40%);
        }

        header { text-align: center; margin-bottom: 40px; }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        #status {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .ticket-btn {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            padding: 25px 10px;
            border-radius: 16px;
            cursor: pointer;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        .ticket-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(0,242,254,0.1), rgba(254,9,121,0.1));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .ticket-btn:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--accent-cyan);
            box-shadow: 0 10px 25px -5px rgba(0, 242, 254, 0.3), 0 0 15px rgba(254, 9, 121, 0.2);
        }

        .ticket-btn:hover::before { opacity: 1; }

        /* Glassmorphism Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 100;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal-content {
            background: rgba(21, 27, 43, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 24px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .modal-content h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.8rem;
            margin-bottom: 25px;
            text-align: center;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
            transition: border 0.3s;
        }

        input::placeholder { color: var(--text-muted); }
        input:focus { outline: none; border-color: var(--accent-cyan); box-shadow: 0 0 0 3px rgba(0, 242, 254, 0.1); }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-pink));
            color: #0b0f19;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Space Grotesk', sans-serif;
            letter-spacing: 0.5px;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0, 242, 254, 0.2); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .cancel-btn {
            width: 100%;
            padding: 12px;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .cancel-btn:hover { background: rgba(255,255,255,0.05); color: var(--text-main); }

        .error-text { color: #ff4d4d; font-size: 0.9rem; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <h1>NEON TICKETS</h1>
        <p id="status">INITIALIZING SYSTEM...</p>
    </header>

    <div class="grid" id="ticketGrid"></div>

    <div class="modal" id="claimModal">
        <div class="modal-content">
            <h2>Claim Ticket #<span id="modalTicketId"></span></h2>
            <form id="claimForm">
                <input type="text" id="userName" placeholder="Enter your full name" required>
                <input type="email" id="userEmail" placeholder="Enter your email" required>
                <button type="submit" class="submit-btn" id="submitBtn">SECURE TICKET & DOWNLOAD</button>
                <button type="button" class="cancel-btn" onclick="closeModal()">Cancel</button>
                <p id="formError" class="error-text" style="display:none;"></p>
            </form>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        // 👇 REPLACE THIS WITH YOUR ACTUAL PIPEDREAM URL 👇
        const PIPEDREAM_URL = "YOUR_PIPEDREAM_WEBHOOK_URL_HERE"; 

        let selectedTicketId = null;

        // ==========================================
        // APP LOGIC
        // ==========================================
        
        async function loadTickets() {
            const statusEl = document.getElementById('status');
            statusEl.innerText = "CONNECTING TO DATABASE...";

            try {
                const response = await fetch(PIPEDREAM_URL, {
                    method: 'GET',
                    mode: 'cors',
                    headers: { 'Accept': 'application/json' }
                });
                
                if (!response.ok) throw new Error(`Server error: ${response.status}`);
                
                const tickets = await response.json();
                renderTickets(tickets);
            } catch (error) {
                statusEl.innerText = "ERROR: CONNECTION FAILED";
                statusEl.style.color = "#ff4d4d";
                console.error("Fetch Error:", error);
            }
        }

        function renderTickets(tickets) {
            const grid = document.getElementById('ticketGrid');
            const status = document.getElementById('status');
            
            grid.innerHTML = '';
            
            if (!tickets || tickets.length === 0) {
                status.innerText = 'SOLD OUT - ALL TICKETS CLAIMED';
                status.style.color = "var(--accent-pink)";
                return;
            }

            status.innerText = `${tickets.length} TICKETS REMAINING`;
            status.style.color = "var(--accent-cyan)";

            tickets.forEach(ticket => {
                const btn = document.createElement('button');
                btn.className = 'ticket-btn';
                btn.innerText = `#${ticket.id}`;
                btn.onclick = () => openModal(ticket.id);
                grid.appendChild(btn);
            });
        }

        function openModal(ticketId) {
            selectedTicketId = ticketId;
            document.getElementById('modalTicketId').innerText = ticketId;
            document.getElementById('claimModal').style.display = 'flex';
            document.getElementById('formError').style.display = 'none';
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('submitBtn').innerText = 'SECURE TICKET & DOWNLOAD';
        }

        function closeModal() {
            document.getElementById('claimModal').style.display = 'none';
            document.getElementById('claimForm').reset();
        }

        document.getElementById('claimForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('userName').value.trim();
            const email = document.getElementById('userEmail').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const formError = document.getElementById('formError');

            submitBtn.disabled = true;
            submitBtn.innerText = 'PROCESSING...';
            formError.style.display = 'none';

            try {
                const response = await fetch(PIPEDREAM_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ ticketId: selectedTicketId, customerName: name, customerEmail: email })
                });

                const data = await response.json();

                if (data.success) {
                    generatePDF(name, selectedTicketId, email);
                    closeModal();
                    loadTickets(); 
                    alert(`Success! Ticket #${selectedTicketId} is yours. Check your downloads.`);
                } else {
                    throw new Error(data.error || "Ticket was just taken by someone else.");
                }
            } catch (error) {
                formError.innerText = error.message;
                formError.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerText = 'SECURE TICKET & DOWNLOAD';
            }
        });

        // ==========================================
        // COOL PDF GENERATION
        // ==========================================
        function generatePDF(name, ticketId, email) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // Dark/Modern PDF Background accents
            doc.setFillColor(11, 15, 25);
            doc.rect(0, 0, 210, 40, 'F'); // Top header bar
            doc.setFillColor(0, 242, 254);
            doc.rect(0, 40, 210, 2, 'F'); // Cyan accent line

            // Header Text
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(24);
            doc.setFont("helvetica", "bold");
            doc.text("NEON EVENT TICKET", 105, 25, { align: 'center' });

            // Ticket Number
            doc.setTextColor(11, 15, 25);
            doc.setFontSize(48);
            doc.text(`#${ticketId}`, 105, 90, { align: 'center' });

            // Details
            doc.setFontSize(12);
            doc.setTextColor(100, 100, 100);
            doc.text("ISSUED TO:", 30, 120);
            doc.text("EMAIL:", 30, 150);
            doc.text("DATE:", 30, 180);

            doc.setFontSize(16);
            doc.setTextColor(11, 15, 25);
            doc.setFont("helvetica", "bold");
            doc.text(name, 30, 132);
            doc.text(email, 30, 162);
            doc.text(new Date().toLocaleDateString(), 30, 192);

            // Footer
            doc.setFillColor(254, 9, 121);
            doc.rect(0, 270, 210, 27, 'F'); // Pink footer bar
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(12);
            doc.text("PRESENT THIS PDF AT THE ENTRANCE", 105, 285, { align: 'center' });

            const safeName = name.replace(/\s+/g, '-');
            doc.save(`NeonTicket-${ticketId}-${safeName}.pdf`);
        }

        loadTickets();
    </script>
</body>
</html>
