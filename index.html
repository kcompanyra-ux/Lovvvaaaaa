<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --error: #ef4444;
            --success: #10b981;
            --border: #d1d5db;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            border: 1px solid #e5e7eb;
        }

        h2 {
            margin: 0 0 1.5rem 0;
            font-size: 1.5rem;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: var(--text-light);
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        input.otp-input {
            text-align: center;
            font-size: 1.5rem;
            letter-spacing: 0.5rem;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 0.5rem;
        }

        button:hover:not(:disabled) {
            background-color: var(--primary-hover);
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 1.25rem;
            font-size: 0.9rem;
            text-align: center;
            display: none;
        }

        .message.error {
            background-color: #fee2e2;
            color: var(--error);
            display: block;
        }

        .message.success {
            background-color: #d1fae5;
            color: #065f46;
            display: block;
        }

        .hidden {
            display: none !important;
        }

        .link-group {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
        }

        a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        a:hover {
            text-decoration: underline;
        }

        .email-display {
            font-weight: bold;
            color: var(--text);
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Secure Login</h2>
        <div id="message" class="message"></div>

        <!-- STEP 1: EMAIL ENTRY -->
        <div id="email-step">
            <p class="subtitle">Enter your email to receive a login code.</p>
            <div class="form-group">
                <label for="emailInput">Email Address</label>
                <input type="email" id="emailInput" placeholder="you@example.com" autocomplete="email">
            </div>
            <button id="sendBtn" onclick="requestOTP()">Send OTP Code</button>
        </div>

        <!-- STEP 2: OTP ENTRY -->
        <div id="otp-step" class="hidden">
            <p class="subtitle">We sent a 6-digit code to<br><span class="email-display" id="emailDisplay"></span></p>
            <div class="form-group">
                <label for="otpInput">Verification Code</label>
                <input type="text" id="otpInput" class="otp-input" placeholder="000000" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
            </div>
            <button id="verifyBtn" onclick="verifyOTP()">Verify & Login</button>
            <div class="link-group">
                <a href="#" onclick="goBackToEmail(); return false;">Change email</a> 
                &nbsp;|&nbsp; 
                <a href="#" onclick="requestOTP(); return false;" id="resendLink">Resend code</a>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION - PASTE YOUR URLS HERE
        // ==========================================
        
        // 1. Paste your Pipedream "Request OTP" Webhook URL here
        const REQUEST_OTP_URL = 'https://eocfcytsk9bh13n.m.pipedream.net';
        
        // 2. Paste your Pipedream "Verify OTP" Webhook URL here
        const VERIFY_OTP_URL = 'https://eoarua3rliiv9et.m.pipedream.net';
        
        // 3. Paste the website URL you want to redirect to after successful login
        const REDIRECT_URL = 'https://www.bandaa.work.gd/'; 
        // ==========================================

        const messageDiv = document.getElementById('message');
        const emailStep = document.getElementById('email-step');
        const otpStep = document.getElementById('otp-step');
        const emailInput = document.getElementById('emailInput');
        const otpInput = document.getElementById('otpInput');
        const sendBtn = document.getElementById('sendBtn');
        const verifyBtn = document.getElementById('verifyBtn');
        const emailDisplay = document.getElementById('emailDisplay');

        // Helper to show messages
        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
        }

        function clearMessage() {
            messageDiv.className = 'message';
            messageDiv.textContent = '';
        }

        // Go back to email step
        function goBackToEmail() {
            otpStep.classList.add('hidden');
            emailStep.classList.remove('hidden');
            clearMessage();
        }

        // STEP 1: Request OTP
        async function requestOTP() {
            clearMessage();
            const email = emailInput.value.trim();

            if (!email || !email.includes('@')) {
                return showMessage('Please enter a valid email address.', 'error');
            }

            sendBtn.disabled = true;
            sendBtn.textContent = 'Sending...';

            try {
                const response = await fetch(REQUEST_OTP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('OTP sent successfully! Check your email.', 'success');
                    emailDisplay.textContent = email;
                    
                    // Switch UI to OTP step
                    emailStep.classList.add('hidden');
                    otpStep.classList.remove('hidden');
                    otpInput.value = ''; // Clear old OTPs
                    otpInput.focus();
                } else {
                    showMessage(data.error || 'Failed to send OTP. Please try again.', 'error');
                }
            } catch (error) {
                showMessage('Network error. Please check your connection.', 'error');
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = 'Send OTP Code';
            }
        }

        // STEP 2: Verify OTP
        async function verifyOTP() {
            clearMessage();
            const email = emailInput.value.trim();
            const otp = otpInput.value.trim();

            if (!otp || otp.length < 6) {
                return showMessage('Please enter the 6-digit OTP code.', 'error');
            }

            verifyBtn.disabled = true;
            verifyBtn.textContent = 'Verifying...';

            try {
                const response = await fetch(VERIFY_OTP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('Login successful! Redirecting...', 'success');
                    
                    // Save the token locally if needed by your destination website
                    localStorage.setItem('authToken', data.token);
                    
                    // Redirect to the target website after a short delay
                    setTimeout(() => {
                        window.location.href = REDIRECT_URL;
                    }, 1000);
                } else {
                    showMessage(data.error || 'Invalid OTP. Please try again.', 'error');
                    otpInput.value = '';
                    otpInput.focus();
                }
            } catch (error) {
                showMessage('Network error. Please check your connection.', 'error');
            } finally {
                verifyBtn.disabled = false;
                verifyBtn.textContent = 'Verify & Login';
            }
        }

        // Allow pressing "Enter" to submit
        emailInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') requestOTP(); });
        otpInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') verifyOTP(); });
        
        // Auto-format OTP input (only allow numbers)
        otpInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });
    </script>
</body>
</html>
