<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>50 Ticket Event</title>
    <!-- jsPDF for generating the ticket PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 20px; background: #f4f7f6; color: #333; }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        #status { font-size: 1.2rem; color: #7f8c8d; margin-bottom: 20px; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 15px; max-width: 800px; margin: 0 auto 30px auto; }
        .ticket-btn { 
            padding: 20px; background: #3498db; color: white; border: none; border-radius: 8px; 
            cursor: pointer; font-size: 16px; font-weight: bold; transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .ticket-btn:hover { background: #2980b9; transform: translateY(-2px); box-shadow: 0 6px 8px rgba(0,0,0,0.15); }
        
        /* Modal Styles */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .modal-content h2 { margin-top: 0; color: #2c3e50; }
        input { 
            width: 100%; padding: 12px; margin: 10px 0; box-sizing: border-box; 
            border: 1px solid #ddd; border-radius: 6px; font-size: 16px; 
        }
        input:focus { outline: none; border-color: #3498db; }
        .submit-btn { 
            width: 100%; padding: 12px; background: #2ecc71; color: white; border: none; 
            border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px;
        }
        .submit-btn:hover { background: #27ae60; }
        .submit-btn:disabled { background: #95a5a6; cursor: not-allowed; }
        .cancel-btn { 
            width: 100%; padding: 12px; background: #e74c3c; color: white; border: none; 
            border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 10px;
        }
        .cancel-btn:hover { background: #c0392b; }
        .error-text { color: #e74c3c; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>🎟️ Grab Your Ticket!</h1>
    <p id="status">Loading tickets...</p>
    <div class="grid" id="ticketGrid"></div>

    <!-- Modal for User Input -->
    <div class="modal" id="claimModal">
        <div class="modal-content">
            <h2>Claim Ticket #<span id="modalTicketId"></span></h2>
            <form id="claimForm">
                <input type="text" id="userName" placeholder="Your Full Name" required>
                <input type="email" id="userEmail" placeholder="Your Email Address" required>
                <button type="submit" class="submit-btn" id="submitBtn">Confirm & Download PDF</button>
                <button type="button" class="cancel-btn" onclick="closeModal()">Cancel</button>
                <p id="formError" class="error-text" style="display:none;"></p>
            </form>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        // 👇 REPLACE THIS WITH YOUR ACTUAL PIPEDREAM URL 👇
        const PIPEDREAM_URL = "https://eozze70y7c24v40.m.pipedream.net"; 

        let selectedTicketId = null;

        // ==========================================
        // APP LOGIC
        // ==========================================
        
        async function loadTickets() {
            const statusEl = document.getElementById('status');
            statusEl.innerText = "Loading tickets...";
            statusEl.style.color = "#7f8c8d";

            try {
                const response = await fetch(PIPEDREAM_URL, {
                    method: 'GET',
                    mode: 'cors',
                    headers: { 'Accept': 'application/json' }
                });
                
                if (!response.ok) {
                    throw new Error(`Server responded with status ${response.status}`);
                }
                
                const tickets = await response.json();
                renderTickets(tickets);
            } catch (error) {
                statusEl.innerText = "Error loading tickets. Check console (F12).";
                statusEl.style.color = "#e74c3c";
                console.error("Fetch Error Details:", error);
            }
        }

        function renderTickets(tickets) {
            const grid = document.getElementById('ticketGrid');
            const status = document.getElementById('status');
            
            grid.innerHTML = '';
            
            if (!tickets || tickets.length === 0) {
                status.innerText = '🎉 SOLD OUT! All 50 tickets have been claimed.';
                status.style.color = "#2ecc71";
                return;
            }

            status.innerText = `${tickets.length} Tickets Remaining`;
            status.style.color = "#2c3e50";

            tickets.forEach(ticket => {
                const btn = document.createElement('button');
                btn.className = 'ticket-btn';
                btn.innerText = `#${ticket.id}`;
                btn.onclick = () => openModal(ticket.id);
                grid.appendChild(btn);
            });
        }

        function openModal(ticketId) {
            selectedTicketId = ticketId;
            document.getElementById('modalTicketId').innerText = ticketId;
            document.getElementById('claimModal').style.display = 'flex';
            document.getElementById('formError').style.display = 'none';
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('submitBtn').innerText = 'Confirm & Download PDF';
        }

        function closeModal() {
            document.getElementById('claimModal').style.display = 'none';
            document.getElementById('claimForm').reset();
        }

        // Handle Form Submission
        document.getElementById('claimForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('userName').value.trim();
            const email = document.getElementById('userEmail').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const formError = document.getElementById('formError');

            // UI Loading state
            submitBtn.disabled = true;
            submitBtn.innerText = 'Processing...';
            formError.style.display = 'none';

            try {
                const response = await fetch(PIPEDREAM_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ 
                        ticketId: selectedTicketId, 
                        customerName: name, 
                        customerEmail: email 
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // 1. Auto-Download PDF for the customer
                    generatePDF(name, selectedTicketId, email);

                    // 2. Close modal and refresh grid
                    closeModal();
                    loadTickets(); 
                    
                    alert(`Success! Ticket #${selectedTicketId} is yours. Check your downloads folder for the PDF.`);
                } else {
                    throw new Error(data.error || "Failed to claim ticket. It might have been taken just now.");
                }
            } catch (error) {
                formError.innerText = error.message;
                formError.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerText = 'Confirm & Download PDF';
                console.error("Claim Error:", error);
            }
        });

        // ==========================================
        // PDF GENERATION
        // ==========================================
        function generatePDF(name, ticketId, email) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // Header
            doc.setFontSize(28);
            doc.setTextColor(44, 62, 80); // Dark blue/grey
            doc.text("EVENT TICKET", 105, 30, { align: 'center' });
            
            // Divider line
            doc.setDrawColor(52, 152, 219);
            doc.setLineWidth(1);
            doc.line(20, 40, 190, 40);

            // Ticket Details
            doc.setFontSize(20);
            doc.setTextColor(52, 152, 219); // Blue
            doc.text(`Ticket #${ticketId}`, 105, 65, { align: 'center' });
            
            doc.setFontSize(14);
            doc.setTextColor(0, 0, 0); // Black
            
            doc.text("Issued To:", 30, 95);
            doc.setFont(undefined, 'bold');
            doc.text(name, 30, 105);
            
            doc.setFont(undefined, 'normal');
            doc.text("Email:", 30, 125);
            doc.text(email, 30, 135);

            doc.text("Date Issued:", 30, 155);
            doc.text(new Date().toLocaleDateString(), 30, 165);

            // Footer
            doc.setDrawColor(52, 152, 219);
            doc.line(20, 240, 190, 240);
            
            doc.setFontSize(12);
            doc.setTextColor(127, 140, 141); // Grey
            doc.text("Please present this PDF at the entrance.", 105, 260, { align: 'center' });
            doc.text("Thank you!", 105, 270, { align: 'center' });

            // Auto-download
            const safeName = name.replace(/\s+/g, '-');
            doc.save(`Ticket-${ticketId}-${safeName}.pdf`);
        }

        // Start the app
        loadTickets();
    </script>
</body>
</html>
