<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub OTP Verification</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container { 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); 
            width: 100%; 
            max-width: 400px;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo { 
            text-align: center; 
            margin-bottom: 30px; 
        }
        .logo svg {
            width: 60px;
            height: 60px;
            fill: #24292e;
        }
        h2 { 
            text-align: center; 
            color: #24292e; 
            margin-bottom: 10px;
            font-size: 24px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group { margin-bottom: 20px; }
        label { 
            display: block; 
            margin-bottom: 8px; 
            color: #24292e; 
            font-weight: 600;
            font-size: 14px;
        }
        input { 
            width: 100%; 
            padding: 12px 16px; 
            border: 2px solid #e1e4e8; 
            border-radius: 6px; 
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button { 
            width: 100%; 
            padding: 14px; 
            background: #24292e; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s;
        }
        button:hover:not(:disabled) { background: #444d56; }
        button:disabled { 
            background: #959da5; 
            cursor: not-allowed; 
        }
        .message { 
            margin-top: 20px; 
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
            display: none;
        }
        .message.show { display: block; }
        .message.error { 
            background: #ffeef0; 
            color: #d32f2f; 
            border: 1px solid #fdaeb7;
        }
        .message.success { 
            background: #dcffe4; 
            color: #2e7d32; 
            border: 1px solid #a7f3ba;
        }
        .message.info { 
            background: #dbedff; 
            color: #0366d6; 
            border: 1px solid #b8daff;
        }
        #otp-section { display: none; }
        .back-link {
            text-align: center;
            margin-top: 15px;
        }
        .back-link a {
            color: #0366d6;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }
        .back-link a:hover { text-decoration: underline; }
        .otp-input {
            letter-spacing: 8px;
            font-size: 24px;
            text-align: center;
            font-weight: bold;
        }
        @media (max-width: 480px) {
            .container { padding: 30px 20px; }
            h2 { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 16 16" version="1.1" width="32" height="32" aria-hidden="true">
                <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-4.22 0-.93.33-1.79.88-2.46-.09-.22-.38-1.1.08-2.29 0 0 .68-.22 2.24.83.65-.18 1.34-.27 2.02-.27.69 0 1.38.09 2.02.27 1.56-1.05 2.24-.83 2.24-.83.46 1.19.17 2.07.08 2.29.55.67.88 1.53.88 2.46 0 3.34-1.87 4.02-3.65 4.22.29.25.54.74.54 1.49 0 1.08-.01 1.95-.01 2.22 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
            </svg>
        </div>
        <h2>Verify to Continue</h2>
        <p class="subtitle">Enter your email to receive a verification code</p>
        
        <div id="email-section">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
            </div>
            <button id="sendBtn" onclick="sendOtp()">Send Verification Code</button>
        </div>

        <div id="otp-section">
            <div class="form-group">
                <label for="otp">Enter 6-Digit Code</label>
                <input type="text" id="otp" class="otp-input" placeholder="000000" maxlength="6" autocomplete="one-time-code" inputmode="numeric">
            </div>
            <button id="verifyBtn" onclick="verifyOtp()">Verify & Continue to GitHub</button>
            <div class="back-link">
                <a onclick="backToEmail()">← Change email address</a>
            </div>
        </div>

        <div id="status-message" class="message"></div>
    </div>

    <script>
        // ⚠️ REPLACE THESE WITH YOUR EMAILJS CREDENTIALS ⚠️
        const EMAILJS_PUBLIC_KEY = "N4YH079AneAeoXdSL";     // Example: "user_abc123xyz"
        const EMAILJS_SERVICE_ID = "service_ffv7vvb";     // Example: "service_xyz789"
        const EMAILJS_TEMPLATE_ID = "template_nq35qav";   // Example: "template_def456"

        // Initialize EmailJS
        (function() {
            emailjs.init(EMAILJS_PUBLIC_KEY);
        })();

        let generatedOtp = "";
        let userEmail = "";
        let otpExpiry = null;

        function showMessage(text, type) {
            const msgEl = document.getElementById('status-message');
            msgEl.textContent = text;
            msgEl.className = 'message show ' + type;
            setTimeout(() => {
                msgEl.classList.remove('show');
            }, 5000);
        }

        function generateOTP() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }

        async function sendOtp() {
            const emailInput = document.getElementById('email').value.trim();
            const sendBtn = document.getElementById('sendBtn');
            
            if (!emailInput || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput)) {
                showMessage('Please enter a valid email address', 'error');
                return;
            }

            sendBtn.disabled = true;
            sendBtn.textContent = 'Sending...';
            showMessage('Sending verification code...', 'info');

            generatedOtp = generateOTP();
            userEmail = emailInput;
            otpExpiry = Date.now() + 5 * 60 * 1000; // 5 minutes

            try {
                await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
                    to_email: userEmail,
                    otp: generatedOtp,
                    to_name: userEmail.split('@')[0]
                });

                document.getElementById('email-section').style.display = 'none';
                document.getElementById('otp-section').style.display = 'block';
                showMessage('Verification code sent! Check your email (valid for 5 min)', 'success');
                document.getElementById('otp').focus();
                
            } catch (error) {
                console.error('EmailJS Error:', error);
                showMessage('Failed to send code. Please check your email configuration.', 'error');
                sendBtn.disabled = false;
                sendBtn.textContent = 'Send Verification Code';
            }
        }

        function verifyOtp() {
            const otpInput = document.getElementById('otp').value.trim();
            const verifyBtn = document.getElementById('verifyBtn');

            if (!otpInput || otpInput.length !== 6) {
                showMessage('Please enter the 6-digit code', 'error');
                return;
            }

            if (Date.now() > otpExpiry) {
                showMessage('Code has expired. Please request a new one.', 'error');
                setTimeout(() => backToEmail(), 2000);
                return;
            }

            if (otpInput === generatedOtp) {
                verifyBtn.disabled = true;
                verifyBtn.textContent = 'Verified! Redirecting...';
                showMessage('✓ Verification successful! Redirecting to GitHub...', 'success');
                
                setTimeout(() => {
                    window.location.href = 'google.com';
                }, 1500);
            } else {
                showMessage('✗ Invalid code. Please try again.', 'error');
                document.getElementById('otp').value = '';
                document.getElementById('otp').focus();
            }
        }

        function backToEmail() {
            document.getElementById('otp-section').style.display = 'none';
            document.getElementById('email-section').style.display = 'block';
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('sendBtn').textContent = 'Send Verification Code';
            document.getElementById('email').focus();
            showMessage('', '');
        }

        // Allow Enter key to submit
        document.getElementById('email').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendOtp();
        });

        document.getElementById('otp').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') verifyOtp();
        });

        // Auto-format OTP input (numbers only)
        document.getElementById('otp').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });
    </script>
</body>
</html>
