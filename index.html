<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #121212; }
    .calculator { width: 320px; background: #1e1e1e; border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .display { text-align: right; padding: 20px 10px; margin-bottom: 20px; }
    #h { color: #888; font-size: 1.2rem; min-height: 1.5rem; margin-bottom: 5px; word-wrap: break-word; }
    #d { color: #fff; font-size: 3rem; font-weight: 300; word-wrap: break-word; }
    .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    button { border: none; outline: none; background: #2d2d2d; color: #fff; font-size: 1.5rem; padding: 20px; border-radius: 50%; cursor: pointer; transition: background 0.2s, transform 0.1s; user-select: none; }
    button:active { transform: scale(0.95); }
    button:hover { background: #3d3d3d; }
    .op { background: #ff9f0a; color: #fff; }
    .op:hover { background: #ffb03b; }
    .fn { background: #a5a5a5; color: #000; }
    .fn:hover { background: #d4d4d4; }
    .zero { grid-column: span 2; border-radius: 40px; text-align: left; padding-left: 30px; }
  </style>
</head>
<body>

<div class="calculator">
  <div class="display">
    <div id="h"></div>
    <div id="d">0</div>
  </div>
  <div class="buttons">
    <button class="fn" data-action="clear">AC</button>
    <button class="fn" data-action="sign">+/-</button>
    <button class="fn" data-action="percent">%</button>
    <button class="op" data-op="/">÷</button>
    <button data-num="7">7</button>
    <button data-num="8">8</button>
    <button data-num="9">9</button>
    <button class="op" data-op="*">×</button>
    <button data-num="4">4</button>
    <button data-num="5">5</button>
    <button data-num="6">6</button>
    <button class="op" data-op="-">−</button>
    <button data-num="1">1</button>
    <button data-num="2">2</button>
    <button data-num="3">3</button>
    <button class="op" data-op="+">+</button>
    <button class="zero" data-num="0">0</button>
    <button data-action="dot">.</button>
    <button class="op" data-action="equals">=</button>
  </div>
</div>

<!-- The logic is loaded externally. HTML viewers will not see the JS code here. -->
<script src="app.js" defer></script>

</body>
</html>
